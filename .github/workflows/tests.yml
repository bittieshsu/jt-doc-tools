# 每次 push / PR 跑測試。
#
# **為什麼要有這一支**：外部評估（2026-09-05）指出測試不是合併與發版的門檻 ——
# 專案有兩千多支測試，但 CI 上一支都沒跑，於是「clone 下來跑不起來」這種只有
# 別人會踩到的問題，自己怎麼跑都看不到（那次實測 70 紅 / 32 error）。
#
# 刻意**分成兩段**：
#
# * `core` —— 不需要 LibreOffice / OCR 模型的部分，每次 push 都跑，幾分鐘。
# * `office` —— 要裝 LibreOffice 與中日韓字型的轉檔測試，只在 PR 與每日跑。
#
# 缺系統相依時**要明確 skip 並寫原因**，不可以靜靜地當成通過。
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每日台北時間 09:00（01:00 UTC）跑一次完整的（含 office）
    - cron: '0 1 * * *'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: 核心測試（不需 Office / OCR）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # **中日韓字型不是 Office 相依** —— 有十幾條測試在驗「中文真的畫得出來」
      # （浮水印的字型退回、限用章的天頭、騎縫章的字寬、字形反查）。
      # 沒有字型時它們會跳過，等於那一整片防護在 CI 上不存在。
      # 裝一個 apt 套件就換回這些涵蓋，很划算（2026-09-06 一次紅了 10 條）。
      - name: 安裝中日韓字型
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: 安裝相依
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: 匯入 smoke test
        run: python -c "import fastapi, fitz, ldap3, jwt, PIL, httpx"
      - name: 版本一致性
        run: python tools/check_version_consistency.py
      - name: 文件與工具涵蓋
        run: python tools/check_docs_tool_coverage.py
      # **失敗的測試名稱要寫成 annotation** —— job 的 log 需要 repo admin 權限
      # 才讀得到，所以光看 "Process completed with exit code 1" 完全無從下手
      # （2026-09-06 為了查兩次紅燈，只能在本機重建環境反推）。
      # `::error::` 產生的 annotation 匿名就讀得到，通知信裡也看得見。
      - name: pytest（排除需要 Office / OCR 的）
        run: |
          set +e
          pytest -q --deselect tests/test_pdf_to_slides.py \
                    --deselect tests/test_office_convert.py \
                    -p no:cacheprovider > /tmp/pytest.out 2>&1
          code=$?
          tail -60 /tmp/pytest.out
          if [ $code -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' /tmp/pytest.out | head -25 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

  security:
    name: 資安測試
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝相依
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit
      - name: OWASP / 越權 / CSRF / SSRF / path traversal
        run: |
          set +e
          pytest -q -p no:cacheprovider \
            tests/test_owasp_top10.py \
            tests/test_authz_boundaries.py \
            tests/test_llm_url_ssrf.py \
            tests/test_path_traversal_audit.py \
            tests/test_open_redirect.py \
            tests/test_id_from_body_acl.py \
            tests/test_csv_injection.py \
            tests/test_broken_input_no_500.py > /tmp/sec.out 2>&1
          code=$?
          tail -60 /tmp/sec.out
          if [ $code -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' /tmp/sec.out | head -25 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code
      # `-ll` 是「Medium 以上」不是「只擋 HIGH」—— 名稱與旗標一度不一致。
      # 這裡**刻意維持 Medium**：2026-09-06 第一次真的跑到這一步就掃出 10 個，
      # 其中四個是用 stdlib ElementTree 解析**使用者上傳的 XML**（實體展開 DoS）。
      # 門檻調低只會讓那種東西再也看不見。
      - name: bandit（Medium 以上、高信心）
        run: |
          set +e
          bandit -r app -ll -iii -q > /tmp/bandit.out 2>&1
          code=$?
          cat /tmp/bandit.out
          if [ $code -ne 0 ]; then
            grep -E '^>> Issue' /tmp/bandit.out | head -25 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

  office:
    name: 轉檔測試（LibreOffice + 中日韓字型）
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝 LibreOffice 與字型
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-calc libreoffice-impress \
            libreoffice-draw fonts-noto-cjk fonts-noto-cjk-extra
      - name: 安裝相依
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: pytest（轉檔相關）
        run: |
          pytest -q -p no:cacheprovider \
            tests/test_office_convert.py \
            tests/test_pdf_to_slides.py \
            tests/test_cjk_font_renders.py
