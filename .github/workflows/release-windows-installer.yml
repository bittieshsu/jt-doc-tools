name: Build Windows installer

# Builds the NSIS GUI installer (jt-doc-tools-<ver>-setup.exe) on an Ubuntu
# runner via makensis. The installer is a thin bootstrapper: it ships only
# the PowerShell core scripts + LICENSE + icon and downloads everything else
# at runtime, so the .exe stays small (~well under 1 MB).
#
# This workflow is NEW and isolated -- it does not touch the existing
# install.ps1 / install.sh one-liner paths or the codeql workflow.
#
# Triggers:
#   * push of a version tag (v*)        -> build + attach to the GitHub Release
#   * manual run (workflow_dispatch)    -> build + upload as a workflow artifact
#
# Code signing: SignPath OSS (production certificate since 2026-07). The signing
# step is gated on the SIGNPATH_ORG_ID secret being present.
#
# **Only a signed installer is ever attached to a Release** (v1.15.36). If the
# signing step produces nothing — approval timed out or was declined, or the
# secrets are missing — the workflow FAILS instead of quietly releasing the
# unsigned build. That fallback is how v1.12.8 / v1.12.10 / v1.12.24 ended up
# on Releases carrying `CN=Test certificate for 'jt-doc-tools [OSS]'`.
# The unsigned build is still kept as a workflow artifact for inspection.
# Setup: packaging/windows/SIGNPATH-APPLICATION.md §3-4 (gitignored).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for the installer filename (blank = read app/main.py)'
        required: false
        default: ''

permissions:
  contents: write   # needed by action-gh-release to attach assets

jobs:
  build:
    runs-on: ubuntu-latest
    # Secrets can't be used directly in `if:` — surface presence via env.
    # POLICY_SLUG switched to release-signing after SignPath issued the
    # PRODUCTION (release) certificate (2026-07). Confirm this slug matches the
    # signing policy in your SignPath console before the next signed tag.
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_ORG_ID }}
      SIGNPATH_PROJECT_SLUG: jt-doc-tools
      SIGNPATH_POLICY_SLUG: release-signing
      SIGNPATH_ARTIFACT_SLUG: initial
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          makensis -VERSION

      - name: Determine version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$V" ]; then
            V=$(grep -oP 'VERSION\s*=\s*"\K[^"]+' app/main.py | head -1)
          fi
          if [ -z "$V" ]; then
            echo "Could not determine version" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building installer for version $V"

      - name: Build installer
        working-directory: packaging/windows
        run: |
          makensis -DVERSION=${{ steps.ver.outputs.version }} installer.nsi
          ls -la jt-doc-tools-${{ steps.ver.outputs.version }}-setup.exe

      - name: Upload as workflow artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: jt-doc-tools-${{ steps.ver.outputs.version }}-setup
          path: packaging/windows/jt-doc-tools-${{ steps.ver.outputs.version }}-setup.exe
          if-no-files-found: error

      # --- code signing (SignPath OSS) — skipped automatically if no secret ---
      - name: Sign installer (SignPath)
        id: sign
        if: ${{ github.ref_type == 'tag' && env.HAS_SIGNPATH != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          # **等待時間一定要拉長**：SignPath 的 signing policy 開著「需要人工
          # 核准」（OSS 憑證強制，關不掉），而 action 的預設等待只有 10 分鐘 ——
          # v1.15.32 那次就是這樣紅的：`The operation has timed out after
          # 00:10:33`，安裝程式明明**已經建好了**，只有簽章與掛上 Release 沒做到。
          #
          # 人工核准可能隔幾小時才發生（深夜打 tag 更是如此），所以給 3 小時。
          # 公開 repo 的 Actions 分鐘數不計費，等待期間只是 idle。
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: packaging/windows/signed

      # 掛上 Release 的**只能是簽章過的那一支**。
      #
      # 這一步原本在拿不到簽章檔時會安靜地改用未簽章版 —— 那是 2026-06
      # 正式憑證還在審核時的設計，而它的後果留在 Release 上：v1.12.8 /
      # v1.12.10 / v1.12.24 掛的是 `CN=Test certificate for 'jt-doc-tools [OSS]'`，
      # Windows 驗出來是 UnknownError，使用者下載會看到「發行者不明」。
      # 沒有人回頭清掉，因為**流程本身不會出聲**。
      #
      # 現在改成直接失敗：未簽章的版本仍然留在 workflow artifact 裡（上一步已
      # 上傳）可以自己抓下來看，但**不會出現在 Release 上**。
      - name: Select release file (signed only)
        id: pick
        if: github.ref_type == 'tag'
        run: |
          SIGNED=$(ls packaging/windows/signed/*.exe 2>/dev/null | head -1)
          if [ -z "$SIGNED" ] || [ ! -f "$SIGNED" ]; then
            echo "::error::找不到簽章過的安裝程式 —— 不發佈未簽章版本。"
            echo "::error::可能原因：SignPath 的核准逾時 / 被拒絕，或這個 repo"
            echo "::error::還沒設定 SIGNPATH_* secrets。未簽章的建置結果在這次"
            echo "::error::執行的 workflow artifact 裡，可自行下載檢查。"
            exit 1
          fi
          echo "Using SIGNED installer: $SIGNED"
          echo "file=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pick.outputs.file }}
          fail_on_unmatched_files: true
